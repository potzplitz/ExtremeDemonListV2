name: Deploy to live server

on:
  push:
    branches:
      - deploy
  # Wird vom !DEPLOY-Workflow gestartet (Pushes mit dem GITHUB_TOKEN lösen "push" nicht aus)
  workflow_dispatch:

# Verhindert, dass zwei Deployments gleichzeitig laufen
concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Zum Anlegen des Releases und Tags
    permissions:
      contents: write

    env:
      CT_ID: "727"
      TARGET_DIR: /var/www/html/gd
      STAGING_DIR: /tmp/gd-deploy
      SSH_HOST: ${{ secrets.PROXMOX_HOST }}
      SSH_USER: ${{ secrets.PROXMOX_USER }}
      SSH_PORT: ${{ secrets.PROXMOX_PORT || '22' }}
      SSHPASS: ${{ secrets.PROXMOX_PASSWORD }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: sshpass installieren und SSH einrichten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host proxmox
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            PreferredAuthentications password
            PubkeyAuthentication no
          EOF

      - name: Dateien in LXC ${{ env.CT_ID }} übertragen (Staging)
        run: |
          tar --exclude='./.git' --exclude='./.github' -czf - . | \
            sshpass -e ssh proxmox "pct exec $CT_ID -- sh -c 'rm -rf $STAGING_DIR && mkdir -p $STAGING_DIR && tar -xzf - -C $STAGING_DIR'"

      - name: Staging nach ${{ env.TARGET_DIR }} synchronisieren
        run: |
          # --delete entfernt Dateien im Ziel, die nicht mehr im Repo sind.
          # Alles, was nur auf dem Server liegt (Config, Uploads, Cache), hier per --exclude schützen!
          sshpass -e ssh proxmox "pct exec $CT_ID -- sh -c '\
            (command -v rsync >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq rsync)) && \
            mkdir -p $TARGET_DIR && \
            rsync -a --delete \
              --filter=\":- .gitignore\" \
              --exclude=env.php \
              --exclude=.env \
              --exclude=uploads/ \
              $STAGING_DIR/ $TARGET_DIR/ && \
            chown -R www-data:www-data $TARGET_DIR && \
            rm -rf $STAGING_DIR'"

      - name: Release mit allen Changes since dem letzten Deploy anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TZ=Europe/Berlin
          NOW=$(date +%s)
          TAG="deploy-$(date -d "@$NOW" +%Y%m%d-%H%M%S)"
          TITLE="Changelog from $(date -d "@$NOW" '+%d.%m.%Y %H:%M')"

          # Letztes Deploy-Release finden (Tags sortieren sich nach Datum)
          PREV=$(git tag --list 'deploy-*' | sort | tail -n 1)
          if [ -n "$PREV" ]; then
            LOG=$(git log "$PREV..HEAD" --no-merges --pretty='- %s (%h, %an)')
          else
            LOG=$(git log --no-merges --max-count=50 --pretty='- %s (%h, %an)')
          fi
          # Den !DEPLOY-Marker aus den Commit-Titeln entfernen
          LOG=$(printf '%s\n' "$LOG" | sed -E 's/^- !deploy:?[[:space:]]*/- /I')

          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            if [ -n "$PREV" ]; then
              echo "Changes since \`$PREV\`:"
            else
              echo "first deploy release (the last 50 Commits):"
            fi
            echo
            if [ -n "$LOG" ]; then
              echo "$LOG"
            else
              echo "_no new commits._"
            fi
            if [ -n "$PREV" ]; then
              echo
              echo "**Compare:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
            fi
          } > "$NOTES"

          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES"
